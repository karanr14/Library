<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library — Download Log</title>
  <!-- Tab Icon -->
  <link rel="icon" type="image/png" href="https://example.com/my-icon.png">
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>

  <div class="wrap">
    
    <div id="view-library" class="view active">
      <header class="masthead">
        <h1>Library</h1>

        <div class="sticky-controls">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="text" id="search-input" placeholder="Search packages…">
          </div>

          <!-- Category Filters -->
          <button type="button" class="bubble-btn active-filter" data-cat="all">All</button>
          <button type="button" class="bubble-btn" data-cat="xplane aircraft">X-Plane Aircraft</button>
          <button type="button" class="bubble-btn" data-cat="apps">Apps</button>
          <button type="button" class="bubble-btn" data-cat="games">Games</button>

          <div class="header-actions">
            <!-- Theme Toggle Button -->
            <button type="button" class="bubble-btn" id="theme-btn" title="Toggle Theme">
              <svg id="theme-icon-moon" viewBox="0 0 24 24" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
              <svg id="theme-icon-sun" viewBox="0 0 24 24" stroke-width="2" style="display:none;"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
              <span id="theme-text">Dark</span>
            </button>

            <!-- Layout View Toggle Button -->
            <button type="button" class="bubble-btn" id="toggle-view-btn" title="Toggle Layout">
              <svg id="view-icon-grid" viewBox="0 0 24 24" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
              <svg id="view-icon-list" viewBox="0 0 24 24" stroke-width="2" style="display:none;"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
              <span id="view-text">List</span>
            </button>

            <!-- Admin Only Controls -->
            <button type="button" class="bubble-btn add-bubble-btn admin-only" id="open-add-btn" title="Add Package">
              <svg viewBox="0 0 24 24" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
              <span>Add</span>
            </button>
            <button type="button" class="bubble-btn admin-only" id="export-btn">Backup</button>
            <button type="button" class="bubble-btn admin-only" id="import-btn">Import</button>
            <input type="file" id="import-input" accept="application/json" hidden>

            <div class="tally-bubble" id="tally">00 LOGGED</div>
          </div>
        </div>
      </header>

      <main>
        <div id="grid" class="grid-layout" aria-live="polite">
          <div class="loading">Loading library…</div>
        </div>
      </main>
    </div>

    <div id="view-add" class="view">
      <div class="add-container">
        <div class="add-header">
          <h2 id="form-title">Log New Package</h2>
          <button type="button" class="bubble-btn" id="cancel-add-btn">← Back to Library</button>
        </div>

        <form id="intake-form" autocomplete="off">
          <input type="hidden" id="edit-id">
          <div class="field">
            <label for="name-input">Package Name</label>
            <input id="name-input" type="text" placeholder="e.g. CricFy TV" maxlength="80" required>
          </div>
          <div class="field">
            <label for="category-select">Category</label>
            <select id="category-select" required>
              <option value="xplane aircraft">X-Plane Aircraft</option>
              <option value="apps">Apps</option>
              <option value="games">Games</option>
            </select>
          </div>
          <div class="field">
            <label for="url-input">Download Link</label>
            <input id="url-input" type="text" placeholder="https://..." required>
          </div>
          <div class="form-actions">
            <button type="button" class="bubble-btn" id="cancel-form-btn">Cancel</button>
            <button type="submit" class="submit-btn" id="submit-btn">Save Package</button>
          </div>
        </form>
      </div>
    </div>

  </div>

  <div class="toast" id="toast" hidden></div>

  <!-- External JavaScript -->
  <script src="script.js"></script>
</body>
</html>
