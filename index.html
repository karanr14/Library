<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library — Download Log</title>
<!-- Tab Icon -->
<link rel="icon" type="image/png" href="https://example.com/my-icon.png">
<!-- Google Fonts: Inter -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;

    /* Uniform corner radius — one value drives every element */
    --radius-subtle: 5px;

    /* Readability text-size control (see #text-size-slider) — leaves UI chrome untouched */
    --content-scale: 1.09;

    /* Pitch Black Base Theme */
    --bg-0: #000000;
    --text: #ffffff;
    --text-dim: rgba(255,255,255,0.85);
    --text-tertiary: rgba(255,255,255,0.5);

    /* Glassy Styling */
    --glass: rgba(255, 255, 255, 0.05);
    --glass-hover: rgba(255, 255, 255, 0.12);
    --glass-border: rgba(255, 255, 255, 0.18);
    --glass-border-hover: rgba(255, 255, 255, 0.5);
    --glass-glow-hover: 0 0 25px rgba(255, 255, 255, 0.25), inset 0 0 15px rgba(255, 255, 255, 0.1);

    --title-gradient: linear-gradient(120deg, #ffffff 20%, #d1d1d6 60%, #8e8e93 100%);
    --name-color: #ffffff;
    --download-bg: rgba(255, 255, 255, 0.08);
    --download-bg-hover: rgba(255, 255, 255, 0.2);
    --input-bg: rgba(0, 0, 0, 0.6);
    --tally-bg: rgba(20, 20, 25, 0.7);
    --toast-bg: rgba(18, 18, 22, 0.96);
    --toast-text: #ffffff;
  }

  /* Light Theme Overrides */
  [data-theme="light"] {
    --bg-0: #eef2f7;
    --text: #0f172a;
    --text-dim: rgba(15, 23, 42, 0.85);
    --text-tertiary: rgba(15, 23, 42, 0.55);

    --glass: rgba(255, 255, 255, 0.45);
    --glass-hover: rgba(255, 255, 255, 0.75);
    --glass-border: rgba(255, 255, 255, 0.6);
    --glass-border-hover: rgba(255, 255, 255, 0.95);
    --glass-glow-hover: 0 10px 30px rgba(0, 0, 0, 0.08), inset 0 0 15px rgba(255, 255, 255, 0.6);

    --title-gradient: linear-gradient(120deg, #0f172a 20%, #334155 60%, #64748b 100%);
    --name-color: #0f172a;
    --download-bg: rgba(255, 255, 255, 0.5);
    --download-bg-hover: rgba(255, 255, 255, 0.85);
    --input-bg: rgba(255, 255, 255, 0.5);
    --tally-bg: rgba(255, 255, 255, 0.6);
    --toast-bg: #ffffff;
    --toast-text: #0f172a;
  }

  /* Pitch Black High-Contrast Admin Mode Override (Red Accent Theme) */
  :root[data-admin="true"] {
    --bg-0: #000000 !important;
    --text: #ffffff !important;
    --text-dim: #ffffff !important;
    --text-tertiary: #a1a1aa !important;
    --name-color: #ffffff !important;
    --glass: rgba(255, 59, 48, 0.05) !important;
    --glass-hover: rgba(255, 59, 48, 0.15) !important;
    --glass-border: rgba(255, 59, 48, 0.6) !important;
    --glass-border-hover: #ff453a !important;
    --title-gradient: linear-gradient(120deg, #ffffff 0%, #ff453a 100%) !important;
    --download-bg: rgba(255, 59, 48, 0.15) !important;
    --download-bg-hover: rgba(255, 59, 48, 0.3) !important;
    --input-bg: #000000 !important;
    --tally-bg: rgba(20, 0, 0, 0.8) !important;
    --toast-bg: rgba(18, 0, 0, 0.96) !important;
    --toast-text: #ffffff !important;
    --glass-glow-hover: 0 0 25px rgba(255, 59, 48, 0.4), inset 0 0 15px rgba(255, 59, 48, 0.2) !important;
  }

  .admin-only { display: none !important; }
  :root[data-admin="true"] .admin-only { display: inline-flex !important; }

  *{ box-sizing:border-box; }

  html {
    background-color: var(--bg-0);
    transition: background-color 0.3s ease;
  }

  body {
    margin:0; padding:0; min-height:100vh;
    background-color: var(--bg-0);
    color: var(--text);
    font-family: var(--font-body);
    overflow-x:hidden;
    position: relative;
  }

  /* Animated Canvas Background */
  #bg-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
  }

  .wrap{ 
    position:relative; z-index:1; 
    width:100%; max-width:100%; 
    padding:40px 4% 100px; 
  }

  .view{ display:none; }
  .view.active{ 
    display:block; 
    animation: pageEntrance 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
  }

  @keyframes pageEntrance {
    0% { opacity: 0; transform: translateY(10px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .masthead{ margin-bottom: 28px; padding-top: 20px; }

  h1{
    font-family: var(--font-display); font-weight:900;
    font-size: clamp(4rem, 9.5vw, 6.4rem); margin:0 0 24px 0;
    letter-spacing:-2px;
    background: var(--title-gradient);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter: drop-shadow(0 6px 34px rgba(255,255,255,0.28)) drop-shadow(0 2px 6px rgba(0,0,0,0.35));
  }
  [data-theme="light"] h1{ filter: drop-shadow(0 8px 24px rgba(15,23,42,0.18)); }

  #theme-toggle-btn {
    position: fixed; top: 24px; right: 4%; z-index: 1000;
  }

  .sticky-controls {
    position: sticky; top: 20px; z-index: 100;
    display: inline-flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 14px;
    background: var(--glass);
    border: 1px solid var(--glass-border); border-radius: var(--radius-subtle);
    backdrop-filter: blur(25px) saturate(180%);
    -webkit-backdrop-filter: blur(25px) saturate(180%);
    box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }

  .search-box{
    position:relative; width: 240px;
    background: var(--input-bg);
    border: 1px solid var(--glass-border); border-radius: var(--radius-subtle);
    display:flex; align-items:center; padding: 0 14px;
    height: 40px; box-sizing: border-box;
    transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    overflow: hidden;
  }
  .search-box:focus-within {
    background: var(--glass-hover); border-color: var(--glass-border-hover);
    box-shadow: var(--glass-glow-hover);
  }
  .search-box svg{ width:18px; height:18px; color:var(--text-dim); margin-right:10px; flex-shrink:0; position: relative; z-index: 1; }
  .search-box input{
    width:100%; background:transparent; border:none; outline:none;
    color:var(--text); font-family:var(--font-body); font-size:0.95rem; padding:0;
    position: relative; z-index: 1;
  }
  .search-box input::placeholder{ color:var(--text-tertiary); }

  .filter-box {
    position: relative;
    overflow: hidden;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-subtle);
    display: flex; align-items: center; padding: 0 12px;
    height: 40px; box-sizing: border-box;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    transition: border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
  }
  .filter-box:hover {
    border-color: var(--glass-border-hover);
    box-shadow: var(--glass-glow-hover);
    background: var(--glass-hover);
  }

  .header-actions{ display:flex; align-items:center; gap:8px; flex-wrap:nowrap; }
  .header-actions .bubble-btn{ height: 40px; box-sizing: border-box; }

  .text-size-control{
    display:inline-flex; align-items:center; gap:8px;
    height:40px; padding:0 12px; box-sizing:border-box;
    border:1px solid var(--glass-border); border-radius: var(--radius-subtle);
    background:
      radial-gradient(120% 140% at 15% 0%, rgba(255,255,255,0.18) 0%, transparent 55%),
      linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.03) 100%);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  }
  .text-size-control .text-size-label{
    font-family: var(--font-body); font-weight:700; font-size:0.85rem;
    color: var(--text-dim); line-height:1; user-select:none; cursor:pointer;
    border:0; padding:0; background:transparent;
  }
  .text-size-control .text-size-label:hover{ color: var(--text); }
  #text-size-slider{
    -webkit-appearance:none; appearance:none;
    width:88px; height:16px; margin:0; background:transparent; cursor:pointer;
  }
  #text-size-slider::-webkit-slider-runnable-track{
    height:4px; border-radius:999px; background: var(--glass-border-hover);
  }
  #text-size-slider::-moz-range-track{
    height:4px; border-radius:999px; background: var(--glass-border-hover);
  }
  #text-size-slider::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:14px; height:14px; margin-top:-5px; border-radius:50%;
    background: var(--text); border:2px solid var(--bg-0); cursor:pointer;
  }
  #text-size-slider::-moz-range-thumb{
    width:14px; height:14px; border-radius:50%;
    background: var(--text); border:2px solid var(--bg-0); cursor:pointer;
  }

  /* Custom Glass Dropdown ("context menu") — replaces native <select> chrome
     everywhere. The real <select> stays in the DOM (hidden) so value/change/
     form semantics keep working exactly as before; this just renders a themed
     trigger + floating panel instead of the browser's own popup. */
  .ss-wrap{ position:relative; width:100%; }
  .ss-native{ position:absolute; opacity:0; pointer-events:none; width:1px; height:1px; overflow:hidden; }
  .ss-trigger{
    all:unset; box-sizing:border-box; display:flex; align-items:center; justify-content:space-between;
    gap:10px; width:100%; cursor:pointer; position:relative; z-index:1;
  }
  .ss-label{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ss-chevron{ width:15px; height:15px; flex-shrink:0; color:var(--text-dim); transition: transform 0.3s cubic-bezier(0.22,0.61,0.36,1); }
  .ss-wrap.open .ss-chevron{ transform: rotate(180deg); }

  .filter-box .ss-trigger{ color: var(--text-dim); font-family: var(--font-body); font-size:0.85rem; font-weight:500; padding:0 4px; height:100%; }

  .field .ss-trigger{
    font-family: var(--font-body); font-size:1rem; padding:14px 18px;
    border-radius: var(--radius-subtle); border:1px solid var(--glass-border);
    background: var(--input-bg); color: var(--text);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    transition: border-color 0.25s ease, background-color 0.25s ease, box-shadow 0.25s ease;
  }
  .field .ss-wrap.open .ss-trigger{
    outline:none; border-color: var(--glass-border-hover);
    background: var(--glass-hover); box-shadow: var(--glass-glow-hover);
  }

  .ss-panel{
    position:fixed; z-index:500;
    background: var(--glass); border:1px solid var(--glass-border); border-radius: var(--radius-subtle);
    backdrop-filter: blur(28px) saturate(190%); -webkit-backdrop-filter: blur(28px) saturate(190%);
    box-shadow: 0 24px 50px -18px rgba(0,0,0,0.55), inset 0 1px 1px rgba(255,255,255,0.15);
    padding:6px; opacity:0; pointer-events:none; transform: translateY(-6px) scale(0.98);
    transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.22,0.61,0.36,1);
    max-height:280px; overflow-y:auto;
  }
  .ss-panel.open{ opacity:1; pointer-events:auto; transform: translateY(0) scale(1); }
  .ss-option{
    position:relative; overflow:hidden;
    display:flex; align-items:center; gap:6px;
    padding:10px 14px; border-radius: calc(var(--radius-subtle) - 1px);
    font-family: var(--font-body); font-size:0.9rem; color: var(--text-dim);
    cursor:pointer; transition: background 0.15s ease, color 0.15s ease; white-space:nowrap;
  }
  .ss-option-label{ position:relative; z-index:1; flex:1; min-width:0; }
  .ss-option-delete{
    display:none; position:relative; z-index:3; flex-shrink:0;
    width:26px; height:26px; padding:0; border:none; border-radius:8px;
    background:transparent; color: var(--text-dim); cursor:pointer;
    align-items:center; justify-content:center;
  }
  .ss-option-delete svg{ width:14px; height:14px; }
  :root[data-admin="true"] .ss-option-delete{ display:inline-flex; }
  .ss-option-delete:hover{ background: rgba(255, 59, 48, 0.2); color:#ff453a; }
  .ss-option:hover{ background: var(--glass-hover); color: var(--text); }
  .ss-option.selected{ color: var(--text); font-weight:700; background: rgba(255,255,255,0.07); }
  [data-theme="light"] .ss-option.selected{ background: rgba(15,23,42,0.06); }

  /* Add-category control next to the admin category picker */
  .category-field-row{ display:flex; gap:8px; align-items:stretch; }
  .category-field-row .ss-wrap{ flex:1; min-width:0; }
  #add-category-btn{ flex-shrink:0; width:48px; padding:0; }

  /* Universal Diagonal Hover Glint for All Elements */
  .bubble-btn::before, .download-btn::before, .copy-btn::before, .action-btn::before, .submit-btn::before, .card::before, .search-box::before, .filter-box::before, .ss-option::before {
    content: ''; position: absolute; top: 0; left: -120%; width: 75%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.16) 35%, rgba(255,255,255,0.5) 50%, rgba(255,255,255,0.16) 65%, transparent);
    transform: skewX(-20deg); transition: left 1.35s cubic-bezier(0.22, 0.61, 0.36, 1); pointer-events: none; z-index: 2;
  }

  .bubble-btn:hover::before, .download-btn:hover::before, .copy-btn:hover::before, .action-btn:hover::before, .submit-btn:hover::before, .card:hover::before, .search-box:hover::before, .filter-box:hover::before, .ss-option:hover::before {
    left: 150%;
  }

  /* Layered Glass Buttons */
  .bubble-btn, .download-btn, .copy-btn, .action-btn, .submit-btn {
    position: relative;
    overflow: hidden;
    font-family: var(--font-body); font-size:0.85rem; font-weight:500;
    color: var(--text-dim); text-decoration:none;
    background:
      radial-gradient(120% 140% at 15% 0%, rgba(255,255,255,0.18) 0%, transparent 55%),
      linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.03) 100%);
    border: 1px solid var(--glass-border); border-radius: var(--radius-subtle);
    padding:8px 16px; cursor:pointer; white-space: nowrap;
    display:inline-flex; align-items:center; justify-content: center; gap:6px;
    backdrop-filter: blur(22px) saturate(190%);
    -webkit-backdrop-filter: blur(22px) saturate(190%);
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4), inset 0 -1px 2px rgba(0, 0, 0, 0.25), 0 4px 12px rgba(0, 0, 0, 0.15), 0 14px 30px -14px rgba(0, 0, 0, 0.35);
    transition: background 0.45s ease, border-color 0.45s ease, color 0.3s ease, box-shadow 0.45s ease, transform 0.25s cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  .bubble-btn:hover, .download-btn:hover, .copy-btn:hover, .action-btn:hover, .submit-btn:hover { 
    background:
      radial-gradient(120% 140% at 15% 0%, rgba(255,255,255,0.3) 0%, transparent 55%),
      linear-gradient(135deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.08) 100%); 
    border-color: var(--glass-border-hover); 
    color: var(--text);
    box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.6), inset 0 -1px 2px rgba(0, 0, 0, 0.2), var(--glass-glow-hover), 0 20px 40px -16px rgba(0, 0, 0, 0.45);
    transform: translateY(-1px);
  }

  .bubble-btn:active, .download-btn:active, .copy-btn:active, .action-btn:active, .submit-btn:active {
    transform: scale(0.98);
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
  }

  .add-bubble-btn {
    font-weight:600;
    color: var(--text); 
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.05) 100%); 
    border-color: var(--glass-border-hover);
  }
  .bubble-btn svg{ width:15px; height:15px; position: relative; z-index: 1; }
  .bubble-btn span { position: relative; z-index: 1; }

  .btn-danger {
    background: linear-gradient(135deg, rgba(255, 59, 48, 0.25) 0%, rgba(255, 59, 48, 0.1) 100%) !important;
    border-color: rgba(255, 59, 48, 0.5) !important;
    color: #ff453a !important;
  }
  .btn-danger:hover {
    background: linear-gradient(135deg, rgba(255, 59, 48, 0.45) 0%, rgba(255, 59, 48, 0.2) 100%) !important;
    border-color: rgba(255, 59, 48, 0.9) !important;
    color: #ffffff !important;
    box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.4), 0 0 25px rgba(255, 59, 48, 0.5) !important;
  }

  :root[data-admin="true"] #theme-toggle-btn {
    background: linear-gradient(135deg, rgba(255, 59, 48, 0.35) 0%, rgba(255, 59, 48, 0.15) 100%) !important;
    border-color: #ff453a !important;
    color: #ff453a !important;
    font-weight: 700;
  }
  :root[data-admin="true"] #theme-toggle-btn:hover {
    background: #ff453a !important;
    color: #ffffff !important;
    box-shadow: 0 0 25px rgba(255, 59, 48, 0.8) !important;
  }

  .tally-bubble {
    font-family: var(--font-mono); font-size:0.8rem; letter-spacing:1px;
    background: var(--tally-bg); border:1px solid var(--glass-border);
    padding:0 14px; border-radius: var(--radius-subtle); color: var(--text-dim); white-space: nowrap;
    height: 40px; box-sizing: border-box; display:inline-flex; align-items:center;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  }

  .grid-layout{ 
    display:grid; grid-template-columns: repeat(4, 1fr); 
    gap:24px; margin-top:28px; position: relative; z-index: 10; width: 100%;
  }

  @media (max-width: 1100px) { .grid-layout { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { .grid-layout { grid-template-columns: 1fr; } }

  .card{
    position:relative; aspect-ratio: 1 / 1;
    background:
      radial-gradient(140% 100% at 20% 0%, rgba(255,255,255,0.10) 0%, transparent 55%),
      var(--glass);
    border:1px solid var(--glass-border); border-radius: var(--radius-subtle);
    padding:16px; display:flex; flex-direction:column; justify-content:space-between;
    backdrop-filter: blur(28px) saturate(170%); -webkit-backdrop-filter: blur(28px) saturate(170%);
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.18), 0 10px 26px -14px rgba(0,0,0,0.4);
    transition: background 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease, transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
    overflow:hidden;
  }

  /* Group tile: sits on top of two "ghost" layers to read as a stacked deck */
  .group-stack {
    position: relative;
    isolation: isolate;
  }

  .stack-ghost {
    position: absolute;
    inset: 0;
    border-radius: var(--radius-subtle);
    background: var(--glass);
    border: 1px solid var(--glass-border);
    pointer-events: none;
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
  }
  .stack-ghost.ghost-1 { transform: translate(7px, 7px) scale(0.985); opacity: 0.75; z-index: 1; }
  .stack-ghost.ghost-2 { transform: translate(14px, 14px) scale(0.97); opacity: 0.4; z-index: 0; }

  .group-stack:hover .stack-ghost.ghost-1 { transform: translate(10px, 12px) scale(0.985); opacity: 0.9; }
  .group-stack:hover .stack-ghost.ghost-2 { transform: translate(20px, 24px) scale(0.97); opacity: 0.6; }

  .card.is-group { position: relative; z-index: 2; cursor: pointer; }

  .group-count-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); font-size: calc(0.8rem * var(--content-scale)); color: var(--text-dim);
    margin-top: 6px;
  }
  .group-count-badge svg { width: 14px; height: 14px; }

  .open-group-btn { font-weight: 600; }

  /* List view: the deck effect doesn't read well in a thin row, so drop the ghosts */
  .list-layout .stack-ghost { display: none; }
  .list-layout .group-stack { width: 100%; }

  .card:hover{ 
    background:
      radial-gradient(140% 100% at 20% 0%, rgba(255,255,255,0.20) 0%, transparent 55%),
      var(--glass-hover); 
    border-color: var(--glass-border-hover); 
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.3), var(--glass-glow-hover), 0 26px 50px -20px rgba(0,0,0,0.5);
    transform: translateY(-3px);
  }

  .card-top-bar {
    position: absolute; top: 16px; right: 16px; left: 16px;
    z-index: 3; display: flex; justify-content: space-between; align-items: center;
  }
  .card-actions{ display:flex; gap:6px; }
  
  .category-badge {
    font-family: var(--font-mono); font-size: calc(0.7rem * var(--content-scale)); font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.5px;
    padding: 4px 8px; border-radius: var(--radius-subtle);
    background: var(--glass); border: 1px solid var(--glass-border);
    color: var(--text-dim); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }

  .action-btn{ width:32px; height:32px; padding: 0; }
  .action-btn svg{ width:14px; height:14px; position: relative; z-index: 1; }

  .body{ margin:auto 0; text-align:center; padding-top:16px; position: relative; z-index: 3; }

  .name{
    font-family: var(--font-display); font-weight:900;

<script>
  /* --- Dynamic Canvas Background Engine with Cursor Orb --- */
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let width, height;
  let orbs = [];

  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let cursorOrbX = mouseX;
  let cursorOrbY = mouseY;

  window.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
  });

  function resizeCanvas() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  class GlowOrb {
    constructor() {
      this.reset();
    }

    reset() {
      this.x = Math.random() * width;
      this.y = Math.random() * height;
      this.radius = Math.random() * 150 + 90;
      this.vx = (Math.random() - 0.5) * 3.2;
      this.vy = (Math.random() - 0.5) * 3.2;
      this.maxAlpha = Math.random() * 0.18 + 0.08;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;

      if (this.x - this.radius > width) this.x = -this.radius;
      if (this.x + this.radius < 0) this.x = width + this.radius;
      if (this.y - this.radius > height) this.y = -this.radius;
      if (this.y + this.radius < 0) this.y = height + this.radius;
    }

    draw() {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      const isAdmin = document.documentElement.getAttribute('data-admin') === 'true';
      
      const gradient = ctx.createRadialGradient(
        this.x, this.y, 0,
        this.x, this.y, this.radius
      );

      if (isAdmin) {
        gradient.addColorStop(0, `rgba(255, 59, 48, ${this.maxAlpha * 0.9})`);
        gradient.addColorStop(0.5, `rgba(180, 20, 20, ${this.maxAlpha * 0.4})`);
        gradient.addColorStop(1, 'rgba(255, 59, 48, 0)');
      } else if (isLight) {
        gradient.addColorStop(0, `rgba(15, 23, 42, ${this.maxAlpha * 1.2})`);
        gradient.addColorStop(0.5, `rgba(30, 41, 59, ${this.maxAlpha * 0.5})`);
        gradient.addColorStop(1, 'rgba(15, 23, 42, 0)');
      } else {
        gradient.addColorStop(0, `rgba(255, 255, 255, ${this.maxAlpha})`);
        gradient.addColorStop(0.5, `rgba(255, 255, 255, ${this.maxAlpha * 0.4})`);
        gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
      }

      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.fill();
    }
  }

  for (let i = 0; i < 42; i++) {
    orbs.push(new GlowOrb());
  }

  function animateOrbs() {
    ctx.clearRect(0, 0, width, height);

    for (let i = 0; i < orbs.length; i++) {
      orbs[i].update();
      orbs[i].draw();
    }

    cursorOrbX += (mouseX - cursorOrbX) * 1.0;
    cursorOrbY += (mouseY - cursorOrbY) * 1.0;

    const cursorRadius = 160;
    const cursorGrad = ctx.createRadialGradient(
      cursorOrbX, cursorOrbY, 0,
      cursorOrbX, cursorOrbY, cursorRadius
    );
    
    const isAdminMode = document.documentElement.getAttribute('data-admin') === 'true';

    if (isAdminMode) {
      cursorGrad.addColorStop(0, 'rgba(255, 59, 48, 0.55)');
      cursorGrad.addColorStop(0.4, 'rgba(255, 30, 30, 0.22)');
      cursorGrad.addColorStop(1, 'rgba(255, 30, 30, 0)');
    } else {
      cursorGrad.addColorStop(0, 'rgba(255, 220, 0, 0.45)');
      cursorGrad.addColorStop(0.4, 'rgba(255, 200, 0, 0.18)');
      cursorGrad.addColorStop(1, 'rgba(255, 200, 0, 0)');
    }

    ctx.beginPath();
    ctx.arc(cursorOrbX, cursorOrbY, cursorRadius, 0, Math.PI * 2);
    ctx.fillStyle = cursorGrad;
    ctx.fill();

    requestAnimationFrame(animateOrbs);
  }
  animateOrbs();

  async function deleteCategory(name) {
    if (!name) return;
    const remaining = Array.from(categorySelect.options).filter(o => o.value && o.value !== name);
    if (remaining.length === 0) {
      showToast('Keep at least one category');
      return;
    }

    const usedCount = links.filter(l => l.category === name).length;
    const fallback = remaining.find(o => o.value === 'Other') ? 'Other' : remaining[0].value;
    if (usedCount > 0) {
      const ok = confirm(usedCount + (usedCount === 1 ? ' package uses "' : ' packages use "') + name + '". Move ' + (usedCount === 1 ? 'it' : 'them') + ' to "' + fallback + '" and delete this category?');
      if (!ok) return;
      links.forEach(l => { if (l.category === name) l.category = fallback; });
      render();
      await persist();
    } else if (!confirm('Delete category "' + name + '"?')) {
      return;
    }

    saveCustomCategories(getCustomCategories().filter(c => c !== name));
    const removed = getRemovedCategories();
    if (!removed.includes(name)) {
      removed.push(name);
      saveRemovedCategories(removed);
    }
    stripCategoryFromSelects(name);
    showToast('Category deleted: ' + name);
  }

  function getCategoryWeight(cat) {
    if (BASE_CATEGORY_WEIGHTS[cat] !== undefined) return BASE_CATEGORY_WEIGHTS[cat];
    const customs = getCustomCategories();
    const idx = customs.indexOf(cat);
    return idx === -1 ? 999 : 100 + idx;
  }

  // Category filter/picker options should reflect whatever categories are
  // actually present in the synced package data — not just the ones a given
  // browser happens to have added locally. This is what makes a category
  // added on one device filterable/sortable from any other device: the data
  // itself (synced via the cloud API) is the real source of truth, and
  // localStorage is only a same-device convenience for re-selecting a
  // category you've used before you've saved a package with it.
  function syncCategoriesFromData(){
    let changed = false;
    links.forEach(link => {
      const cat = link.category;
      if (!cat) return;
      [categoryFilter, categorySelect].forEach(sel => {
        if (!Array.from(sel.options).some(o => o.value === cat)) {
          const opt = document.createElement('option');
          opt.value = cat; opt.textContent = cat;
          sel.appendChild(opt);
          changed = true;
        }
      });
    });
    if (changed) {
      categoryFilter._rebuildDropdown && categoryFilter._rebuildDropdown();
      categorySelect._rebuildDropdown && categorySelect._rebuildDropdown();
    }
  }

  // Load any admin-added categories (from a previous session, this device
  // only) into both category dropdowns before the custom-dropdown UI reads
  // their options.
  (function loadCustomCategoriesIntoSelects(){
    getCustomCategories().forEach(cat => {
      [categoryFilter, categorySelect].forEach(sel => {
        if (!Array.from(sel.options).some(o => o.value === cat)) {
          const opt = document.createElement('option');
          opt.value = cat; opt.textContent = cat;
          sel.appendChild(opt);
        }
      });
    });
    getRemovedCategories().forEach(cat => {
      [categoryFilter, categorySelect].forEach(sel => {
        Array.from(sel.options).forEach(o => { if (o.value === cat) o.remove(); });
      });
    });
  })();

  // Admin: add a brand-new category on the fly (only reachable from inside
  // the admin-only Add Package form).
  if (addCategoryBtn) {
    addCategoryBtn.addEventListener('click', () => {
      const raw = prompt('New category name:');
      if (raw === null) return;
      const name = raw.trim();
      if (!name) return;
      const alreadyExists = Array.from(categorySelect.options).some(o => o.value.toLowerCase() === name.toLowerCase());
      if (alreadyExists) { showToast('That category already exists'); return; }

      saveRemovedCategories(getRemovedCategories().filter(c => c.toLowerCase() !== name.toLowerCase()));

      [categoryFilter, categorySelect].forEach(sel => {
        const opt = document.createElement('option');
        opt.value = name; opt.textContent = name;
        sel.appendChild(opt);
        sel._rebuildDropdown && sel._rebuildDropdown();
      });

      const customs = getCustomCategories();
      if (!customs.includes(name)) customs.push(name);
      saveCustomCategories(customs);

      categorySelect.value = name;
      categorySelect._syncDropdown && categorySelect._syncDropdown();
      showToast('Category added: ' + name);
    });
  }

  // Custom Glass Dropdown ("context menu") — wraps a native <select> so it
  // keeps working exactly as before (value, change events, form semantics)
  // while rendering a themed trigger + floating panel instead of the OS UI.
  // The panel is portaled to <body> with fixed positioning so it's never
  // clipped by an ancestor's overflow:hidden (e.g. .filter-box).
  function createDropdown(select){
    const wrap = document.createElement('div');
    wrap.className = 'ss-wrap';
    select.parentNode.insertBefore(wrap, select);
    wrap.appendChild(select);
    select.classList.add('ss-native');
    select.tabIndex = -1;

    const trigger = document.createElement('button');
    trigger.type = 'button';
    trigger.className = 'ss-trigger';
    trigger.innerHTML = '<span class="ss-label"></span><svg class="ss-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>';
    wrap.appendChild(trigger);
    const label = trigger.querySelector('.ss-label');

    const panel = document.createElement('div');
    panel.className = 'ss-panel';
    document.body.appendChild(panel);

    function buildOptions(){
      panel.innerHTML = '';
      const isCategoryList = select === categoryFilter || select === categorySelect;
      Array.from(select.options).forEach(opt => {
        const item = document.createElement('div');
        item.className = 'ss-option' + (opt.value === select.value ? ' selected' : '');
        const labelSpan = document.createElement('span');
        labelSpan.className = 'ss-option-label';
        labelSpan.textContent = opt.textContent;
        item.appendChild(labelSpan);
        if (isCategoryList && opt.value) {
          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'ss-option-delete admin-only';
          delBtn.title = 'Delete category';
          delBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';
          delBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            close();
            deleteCategory(opt.value);
          });
          item.appendChild(delBtn);
        }
        item.addEventListener('click', () => {
          if (select.value !== opt.value) {
            select.value = opt.value;
            select.dispatchEvent(new Event('change', { bubbles: true }));
          }
          sync();
          close();
        });
        panel.appendChild(item);
      });
    }

    function position(){
      const r = trigger.getBoundingClientRect();
      panel.style.left = Math.round(r.left) + 'px';
      panel.style.top = Math.round(r.bottom + 8) + 'px';
      panel.style.minWidth = Math.round(r.width) + 'px';
    }

    function open(){
      document.querySelectorAll('.ss-wrap.open').forEach(w => { if (w !== wrap) w.dispatchEvent(new Event('forceclose')); });
      buildOptions();
      position();
      wrap.classList.add('open');
      panel.classList.add('open');
    }
    function close(){
      wrap.classList.remove('open');
      panel.classList.remove('open');
    }
    wrap.addEventListener('forceclose', close);

    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      if (wrap.classList.contains('open')) close(); else open();
    });
    document.addEventListener('click', (e) => {
      if (!wrap.contains(e.target) && !panel.contains(e.target)) close();
    });
    window.addEventListener('resize', () => { if (wrap.classList.contains('open')) position(); });
    window.addEventListener('scroll', () => { if (wrap.classList.contains('open')) close(); }, true);

    function sync(){
      const selectedOpt = select.options[select.selectedIndex];
      label.textContent = selectedOpt ? selectedOpt.textContent : '';
    }
    sync();
    select._syncDropdown = sync;
    select._rebuildDropdown = () => { buildOptions(); sync(); };
  }

  [categoryFilter, sortSelect, categorySelect, entryTypeSelect].forEach(createDropdown);

  // Text-size control — scales package names/meta/notes via --content-scale
  // without touching button or input chrome, so all controls stay uniform.
  const TEXT_SCALE_MIN = 1;
  const TEXT_SCALE_MAX = 1.5;
  const TEXT_SCALE_RESET = 1.09;
  const LEGACY_TEXT_SCALE_STEPS = [1, 1.15, 1.3, 1.5];

  function readInitialTextScale(){
    const stored = parseFloat(localStorage.getItem('contentScale'));
    if (!isNaN(stored) && stored >= TEXT_SCALE_MIN && stored <= TEXT_SCALE_MAX) return stored;
    const idx = parseInt(localStorage.getItem('contentScaleIndex') || '0', 10);
    if (!isNaN(idx) && LEGACY_TEXT_SCALE_STEPS[idx] !== undefined) return LEGACY_TEXT_SCALE_STEPS[idx];
    return TEXT_SCALE_MIN;
  }

  let textScale = readInitialTextScale();

  function applyTextScale(){
    document.documentElement.style.setProperty('--content-scale', String(textScale));
    if (textSizeSlider) {
      textSizeSlider.value = String(textScale);
      textSizeSlider.title = 'Text size: ' + Math.round(textScale * 100) + '%';
    }
    if (textSizeLabel) textSizeLabel.title = 'Text size: ' + Math.round(textScale * 100) + '%';
  }
  applyTextScale();

  if (textSizeSlider) {
    textSizeSlider.addEventListener('input', () => {
      const next = parseFloat(textSizeSlider.value);
      if (isNaN(next)) return;
      textScale = Math.min(TEXT_SCALE_MAX, Math.max(TEXT_SCALE_MIN, next));
      localStorage.setItem('contentScale', String(textScale));
      applyTextScale();
    });
  }

  if (textSizeLabel) {
    const resetTextScale = () => {
      textScale = TEXT_SCALE_RESET;
      localStorage.setItem('contentScale', String(textScale));
      applyTextScale();
    };
    textSizeLabel.addEventListener('click', resetTextScale);
  }

  // Toggle Entry Type in Form
  entryTypeSelect.addEventListener('change', () => {
    if (entryTypeSelect.value === 'group') {
      singleUrlField.style.display = 'none';
      groupBuilderField.style.display = 'flex';

    } else {
      singleUrlField.style.display = 'flex';
      groupBuilderField.style.display = 'none';

  function addSubLinkRow(nameVal = '', urlVal = '') {

    row.innerHTML = `
      <input type="text" placeholder="Sub-link name" class="sub-name" value="${nameVal}" required style="flex:1;">

  // Theme Handling
  let currentTheme = localStorage.getItem('theme') || 'dark';
  
  function applyTheme() {
    if (adminMode) return;
    if (currentTheme === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
      themeIconMoon.style.display = 'none';
      themeIconSun.style.display = 'block';
      themeIconCancel.style.display = 'none';
      themeText.textContent = 'Light';
    } else {
      document.documentElement.removeAttribute('data-theme');
      themeIconMoon.style.display = 'block';
      themeIconSun.style.display = 'none';
      themeIconCancel.style.display = 'none';
      themeText.textContent = 'Dark';
    }
  }
  applyTheme();

  function updateAdminButtonState() {
    if (adminMode) {
      themeIconMoon.style.display = 'none';
      themeIconSun.style.display = 'none';
      themeIconCancel.style.display = 'block';
      themeText.textContent = 'Cancel Admin';
    } else {
      themeIconCancel.style.display = 'none';
      applyTheme();
    }
  }

  themeToggleBtn.addEventListener('click', () => {
    if (adminMode) {
      adminMode = false;
      document.documentElement.removeAttribute('data-admin');
      currentTheme = 'dark';
      localStorage.setItem('theme', 'dark');
      updateAdminButtonState();
      applyTheme();
      render();
      return;
    }

    themeClickCount++;
    if (themeClickTimer) clearTimeout(themeClickTimer);
    themeClickTimer = setTimeout(() => { themeClickCount = 0; }, 1500);

    if (themeClickCount >= 10) {
      themeClickCount = 0;
      const password = prompt('Enter admin password:');
      if (!password) return;

      fetch('/api/verify-admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          adminMode = true;
          document.documentElement.setAttribute('data-admin', 'true');
          updateAdminButtonState();
          render();
          showToast('Admin mode unlocked');
        } else {
          showToast('Incorrect password');
        }
      })
      .catch(() => showToast('Verification failed'));
      return;
    }

    currentTheme = currentTheme === 'light' ? 'dark' : 'light';
    localStorage.setItem('theme', currentTheme);
    applyTheme();
  });

  function pad(n){ return String(n).padStart(2, '0'); }

  function getSubItems(entry){
    return Array.isArray(entry && entry.items) ? entry.items : [];
  }

  function isGroupEntry(entry){
    return !!(entry && (entry.isGroup || getSubItems(entry).length > 0));
  }

  function countLinksInEntry(entry){
    if (isGroupEntry(entry)) return getSubItems(entry).length;
    return 1;
  }

  function totalLoggedLinks(list){
    return (list || []).reduce((sum, entry) => sum + countLinksInEntry(entry), 0);
  }

  function hostnameOf(url){
    try { return new URL(url).hostname.replace(/^www\./, ''); }
    catch(e){ return 'external link'; }
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.hidden = false;
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.hidden = true; }, 3000);
  }

  function switchView(target, isEdit = false){
    viewLibrary.classList.remove('active');
    viewAdd.classList.remove('active');
    viewGroup.classList.remove('active');

    if(target === 'add'){
      if(!isEdit) {
        formTitle.textContent = 'Log New Package';
        editIdInput.value = '';
        form.reset();
        entryTypeSelect.value = 'single';
        categorySelect._syncDropdown && categorySelect._syncDropdown();
        entryTypeSelect._syncDropdown && entryTypeSelect._syncDropdown();
        singleUrlField.style.display = 'flex';
        groupBuilderField.style.display = 'none';
        urlInput.setAttribute('required', 'true');
        subLinksContainer.innerHTML = '';
      }
      viewAdd.classList.add('active');
      nameInput.focus();
    } else if(target === 'group'){
      viewGroup.classList.add('active');
    } else {
      viewLibrary.classList.add('active');
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  backFromGroupBtn.addEventListener('click', () => switchView('library'));

  function buildDownloadTile(item, categoryLabel){
    const card = document.createElement('article');
    card.className = 'card';

    const topBar = document.createElement('div');

    const badge = document.createElement('div');

    const footerButtons = document.createElement('div');

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(item.url);
        showToast('URL copied to clipboard!');

  function openGroupView(link){
    groupViewTitle.textContent = link.name;
    const count = (link.items || []).length;
    groupViewMeta.textContent = count + (count === 1 ? ' link' : ' links') + ' · ' + (link.category || 'Other');

  async function persist() {
    try {
      showToast('Syncing to cloud...');
      const response = await fetch(API_URL, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(links)
      });
      if (!response.ok) throw new Error('Cloud save failed');
    } catch(e) {
      console.error('Save failed', e);
      showToast('Cloud sync failed');
    }
  }

  async function loadLinks() {
    try {
      const response = await fetch(API_URL);
      if (response.ok) {
        const data = await response.json();
        links = Array.isArray(data.record) ? data.record : [];
        syncCategoriesFromData();
        render();
        return;
      }
    } catch(e) {
      console.error('Fetch failed', e);
    }

    links = [];
    render();
  }

  function render(){
    const query = searchInput.value.trim().toLowerCase();
    const selectedCategory = categoryFilter.value;
    const sortCriteria = sortSelect.value;

    let filtered = links.filter(l => {
      const matchesSearch = l.name.toLowerCase().includes(query) || (l.url && l.url.toLowerCase().includes(query)) || (l.category && l.category.toLowerCase().includes(query)) || (l.note && l.note.toLowerCase().includes(query)) || (l.items && l.items.some(i => i.name.toLowerCase().includes(query) || i.url.toLowerCase().includes(query)));
      const matchesCategory = !selectedCategory || l.category === selectedCategory;
      return matchesSearch && matchesCategory;
    });

    // Apply Sorting Options
    filtered.sort((a, b) => {
      if (sortCriteria === 'default') {
        const weightA = getCategoryWeight(a.category);
        const weightB = getCategoryWeight(b.category);
        if (weightA !== weightB) return weightA - weightB;
        return a.name.localeCompare(b.name);
      } else if (sortCriteria === 'recent') {
        const timeA = a.addedAt || 0;
        const timeB = b.addedAt || 0;
        return timeB - timeA;
      } else if (sortCriteria === 'name') {
        return a.name.localeCompare(b.name);
      }
      return 0;
    });

    tally.textContent = pad(totalLoggedLinks(links)) + ' LOGGED';
    grid.innerHTML = '';

    if(filtered.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = (query || selectedCategory) ? 'No matching packages found.' : 'Your library is empty.<br>Click Admin Mode to log your first package.';
      grid.appendChild(empty);
      return;
    }

    filtered.forEach((link) => {
      const card = document.createElement('article');

      const topBar = document.createElement('div');
      topBar.className = 'card-top-bar';

      const badge = document.createElement('div');

      const actions = document.createElement('div');
      actions.className = 'card-actions';

      const editBtn = document.createElement('button');
      editBtn.type = 'button';
      editBtn.className = 'action-btn admin-only';

      editBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'action-btn admin-only btn-danger';
      if (adminMode) removeBtn.style.display = 'flex';
      removeBtn.title = 'Remove ' + link.name;
      removeBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';

      actions.appendChild(editBtn);
      actions.appendChild(removeBtn);

      topBar.appendChild(badge);
      topBar.appendChild(actions);
      card.appendChild(topBar);

      const body = document.createElement('div');
      body.className = 'body';
      const nameEl = document.createElement('h2');
      nameEl.className = 'name';
      nameEl.textContent = link.name;
      body.appendChild(nameEl);

      if (link.note) {
        const noteEl = document.createElement('div');
        noteEl.className = 'card-note';
        noteEl.textContent = link.note;
        body.appendChild(noteEl);
      }

      const footerButtons = document.createElement('div');
      footerButtons.className = 'card-footer-buttons';

      if (isGroupEntry(link)) {
        const count = getSubItems(link).length;
        const countEl = document.createElement('div');
        countEl.className = 'group-count-badge';
        countEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg><span>' + count + (count === 1 ? ' link inside' : ' links inside') + '</span>';
        body.appendChild(countEl);

        const openBtn = document.createElement('button');
        openBtn.type = 'button';
        openBtn.className = 'download-btn open-group-btn';
        openBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M3 7l3-4h6l3 4"/></svg><span>Open Group</span>';
        footerButtons.appendChild(openBtn);
        card.appendChild(footerButtons);

        card.addEventListener('click', (e) => {
          if (e.target.closest('.action-btn')) return;
          openGroupView(link);
        });

        const stackWrap = document.createElement('div');
        stackWrap.className = 'group-stack';
        const ghost2 = document.createElement('div');
        ghost2.className = 'stack-ghost ghost-2';
        const ghost1 = document.createElement('div');
        ghost1.className = 'stack-ghost ghost-1';
        stackWrap.appendChild(ghost2);
        stackWrap.appendChild(ghost1);
        stackWrap.appendChild(card);

        grid.appendChild(stackWrap);
      } else {
        const metaEl = document.createElement('div');
        metaEl.className = 'meta';
        metaEl.textContent = hostnameOf(link.url);
        body.appendChild(metaEl);
        card.appendChild(body);

        const dl = document.createElement('a');
        dl.className = 'download-btn';
        dl.href = link.url;
        dl.target = '_blank';
        dl.rel = 'noopener noreferrer';
        dl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg><span>Download</span>';

        const copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.className = 'copy-btn';
        copyBtn.title = 'Copy URL';
        copyBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
        copyBtn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(link.url);
            showToast('URL copied to clipboard!');
          } catch(e) {
            showToast('Failed to copy URL');
          }
        });

        footerButtons.appendChild(dl);
        footerButtons.appendChild(copyBtn);
        card.appendChild(footerButtons);

        grid.appendChild(card);
      }

      editBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        formTitle.textContent = 'Edit Package';
        editIdInput.value = link.id;
        nameInput.value = link.name;
        categorySelect.value = link.category || 'X-Plane Aircraft';
        categorySelect._syncDropdown && categorySelect._syncDropdown();
        noteInput.value = link.note || '';
        
        if (isGroupEntry(link)) {
          entryTypeSelect.value = 'group';
          entryTypeSelect._syncDropdown && entryTypeSelect._syncDropdown();
          singleUrlField.style.display = 'none';
          groupBuilderField.style.display = 'flex';
          urlInput.removeAttribute('required');
          subLinksContainer.innerHTML = '';
          (link.items || []).forEach(i => addSubLinkRow(i.name, i.url));
        } else {
          entryTypeSelect.value = 'single';
          entryTypeSelect._syncDropdown && entryTypeSelect._syncDropdown();
          singleUrlField.style.display = 'flex';
          groupBuilderField.style.display = 'none';
          urlInput.setAttribute('required', 'true');
          urlInput.value = link.url;
        }

        switchView('add', true);
      });

      removeBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        links = links.filter(l => l.id !== link.id);
        render();
        await persist();
        showToast('Package removed globally');
      });
    });
  }

  openAddBtn.addEventListener('click', () => switchView('add'));
  cancelAddBtn.addEventListener('click', () => switchView('library'));
  cancelFormBtn.addEventListener('click', () => switchView('library'));

  searchInput.addEventListener('input', render);
  categoryFilter.addEventListener('change', render);
  sortSelect.addEventListener('change', render);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const name = nameInput.value.trim();
    const category = categorySelect.value;
    const note = noteInput.value.trim();
    const isGroup = entryTypeSelect.value === 'group';
    const editId = editIdInput.value;

    if(!name) return;

    let payload = {
      name,
      category,
      note,
      isGroup
    };

    if (isGroup) {
      const rows = subLinksContainer.querySelectorAll('.sub-link-row');
      const items = [];
      for (let row of rows) {
        let subName = row.querySelector('.sub-name').value.trim();
        let subUrl = row.querySelector('.sub-url').value.trim();
        if (subName && subUrl) {
          if (!/^https?:\/\//i.test(subUrl)) subUrl = 'https://' + subUrl;
          items.push({ name: subName, url: subUrl });
        }
      }
      if (items.length === 0) {
        showToast('Please add at least one valid sub-link');
        return;
      }
      payload.items = items;
    } else {
      let url = urlInput.value.trim();
      if (!url) return;
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      payload.url = url;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Saving…';

    if(editId) {
      const idx = links.findIndex(l => l.id === editId);
      if(idx !== -1) {
        links[idx] = { ...links[idx], ...payload };
      }
    } else {
      links.unshift({
        id: 'pkg-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        ...payload,
        addedAt: Date.now()
      });
    }

    render();
    switchView('library');
    await persist();
    
    form.reset();
    submitBtn.disabled = false;
    submitBtn.textContent = 'Save Package';
    showToast(editId ? 'Package updated!' : 'Package added for everyone!');
  });

  exportBtn.addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(links, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'library-backup.json';
    a.click(); URL.revokeObjectURL(url);
  });

  importBtn.addEventListener('click', () => importInput.click());

  importInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if(Array.isArray(data)){
        links = data;
        syncCategoriesFromData();
        render();
        await persist();
        showToast('Library updated globally');
      }
    } catch(err){ showToast('Failed to import backup'); }
  });

  loadLinks();
</script>
</body>
</html>
